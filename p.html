<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Flicks player</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  #err { color: #ff9b9b; font: 28px sans-serif; padding: 60px; }
</style>
</head>
<body>
<script>
  // Обёртка для Flicks на webOS: один адрес плеера во фрагменте (#u=...), чтобы он не уходил на сервер.
  // Список источников и переключение — в приложении (экран фильма), Back возвращает туда.
  (function () {
    var m = /[#&]u=([^&]+)/.exec(location.hash);
    var u = m ? decodeURIComponent(m[1]) : '';
    if (!/^https:\/\/[^\/\s]+/i.test(u)) {
      var e = document.createElement('div');
      e.id = 'err';
      e.textContent = 'Некорректный адрес плеера';
      document.body.appendChild(e);
      return;
    }
    var f = document.createElement('iframe');
    f.setAttribute('allow', 'autoplay; fullscreen');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.src = u;
    document.body.appendChild(f);

    // Фокус, пришедший в обёртку (кнопка «Управлять плеером»), сразу отдаём плееру — иначе пульт до него не доходит.
    function pass() { try { f.focus(); if (f.contentWindow) { f.contentWindow.focus(); } } catch (x) {} }
    window.addEventListener('focus', pass);
    f.addEventListener('load', function () { if (document.hasFocus()) { pass(); } });
  })();
</script>
</body>
</html>
